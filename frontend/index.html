<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Barba | Venta de iPhones</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
    text-align: center;
    padding: 30px;
  }
  h1 { margin-bottom: 5px; }

  form {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  input {
    padding: 8px;
    border-radius: 6px;
    border: none;
  }
  button {
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: #fff;
  }
  .btn-add  { background: #4da6ff; }
  .btn-buy  { background: #28a745; margin-right: 6px; }
  .btn-del  { background: #dc3545; }
  button:disabled { background: #555; cursor: not-allowed; }

  #productos {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin-top: 30px;
  }
  .card {
    background: #1c1c1c;
    border-radius: 10px;
    padding: 20px;
    width: 200px;
  }
  .precio { font-size: 1.3rem; color: #4da6ff; margin: 6px 0; }
  .acciones { margin-top: 10px; }
</style>
</head>
<body>

  <h1>📱 Barba</h1>
  <p>Tienda de iPhones</p>

  <form id="form-agregar">
    <input type="text" id="modelo" placeholder="Modelo (ej: iPhone 16)" required>
    <input type="number" id="precio" placeholder="Precio" step="0.01" min="0" required>
    <input type="number" id="stock" placeholder="Stock" min="0" required>
    <button type="submit" class="btn-add">Agregar</button>
  </form>

  <div id="productos">Cargando productos...</div>

  <script>
    const API = "http://localhost:8080/index.php";

    async function cargarProductos() {
      const res = await fetch(API + "?action=list");
      const productos = await res.json();
      const cont = document.getElementById("productos");

      if (!productos.length) {
        cont.innerHTML = "<p>No hay productos en el catálogo</p>";
        return;
      }

      cont.innerHTML = productos.map(p => `
        <div class="card">
          <h3>${p.modelo}</h3>
          <p class="precio">$${Number(p.precio).toFixed(2)}</p>
          <p>Stock: ${p.stock}</p>
          <div class="acciones">
            <button class="btn-buy" onclick="comprar(${p.id})" ${p.stock <= 0 ? "disabled" : ""}>
              ${p.stock <= 0 ? "Agotado" : "Comprar"}
            </button>
            <button class="btn-del" onclick="eliminar(${p.id})">Eliminar</button>
          </div>
        </div>
      `).join("");
    }

    async function comprar(id) {
      const res = await fetch(`${API}?action=buy`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ id }),
      });
      const data = await res.json();
      if (data.error) {
        alert(data.error);
      } else {
        alert("✅ Compra realizada");
      }
      cargarProductos();
    }

    async function eliminar(id) {
      if (!confirm("¿Eliminar este iPhone del catálogo?")) return;

      await fetch(`${API}?action=delete`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ id }),
      });
      cargarProductos();
    }

    document.getElementById("form-agregar").addEventListener("submit", async (e) => {
      e.preventDefault();

      const modelo = document.getElementById("modelo").value;
      const precio = document.getElementById("precio").value;
      const stock  = document.getElementById("stock").value;

      await fetch(`${API}?action=add`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ modelo, precio, stock }),
      });

      e.target.reset();
      cargarProductos();
    });

    cargarProductos();
  </script>

</body>
</html>
